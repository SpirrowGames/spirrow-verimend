[project]
name = "verimend"
dynamic = ["version"]
description = "Detect drift between Spirrow product reality and its documentation, and propose fixes as pull requests."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
]

[project.scripts]
verimend = "verimend.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The version is declared exactly once, in src/verimend/__init__.py.
# Hatchling reads that assignment at build time, so the packaging metadata
# and the value /health reports are the same fact and cannot drift.
[tool.hatch.version]
path = "src/verimend/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/verimend"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
